<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register: Bring Back the Light</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/Bring_Back_the_Light_Logo.png" type="image/png">
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo">
                <img src="assets/Bring_Back_the_Light_Logo.png" alt="Bring Back the Light Logo" width="100" height="90">
            </div>
    
            <div class="header-text">
                <h1>Bring Back the Light</h1>
                <h2>Fireflies Conservation Initiative In Bali</h2>
            </div>

            <div class="header_buttons">
                <a href="https://bringbackthelight.org/" class="learn_more" target="_blank">Learn More</a>
            </div>
        </div>
    </header>

    <main>
        <div class="video_background">
            <video autoplay loop muted playsinline preload="auto" id="background_video">
                <source src="assets/Firefly Backdrop.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <div class="form-container">
            <form method="post">
                <div class="full_name">
                    <label for="full_name">Name:</label>
                    <input type="text" name="full_name" id="full_name" required minlength="3" placeholder="Enter your full name">
                </div>

                <div class="email">
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" required placeholder="Enter your email">
                </div>

                <div class="password">
                    <label for="password">Password:</label>
                    <input type="password" name="password" id="password" required minlength="8" pattern="^(?=.*[0-9])(?=.*[\W_]).{8,}$" placeholder="Enter a strong password">
                </div>

                <ul id="password_requirements">
                    <li id="length">At least 8 characters</li>
                    <li id="number">At least 1 number</li>
                    <li id="special">At least 1 special character</li>
                </ul>

                <div class="confirm_password">
                    <label for="confirm_password">Confirm Password:</label>
                    <input type="password" name="confirm_password" id="confirm_password" required minlength="8" pattern="^(?=.*[0-9])(?=.*[\W_]).{8,}$" onkeyup="validatePassword()" placeholder="Re-enter your password">
                </div>

                <ul id="confirm_requirements">
                    <li id="match">Passwords match</li>
                </ul>

                <div class="gender">
                    <label for="gender">Gender:</label>

                    <label for="male">Male</label>
                    <input type="radio" name="gender" id="male" value="male" required>
                    
                    <label for="female">Female</label>
                    <input type="radio" name="gender" id="female" value="female">

                    <label for="nonbinary">Non-binary</label>
                    <input type="radio" name="gender" id="nonbinary" value="nonbinary">
                
                    <label for="other">Other:</label>
                    <input type="radio" name="gender" id="other" value="other">
                </div>

                <div id="other_gender_container" style="display: none; margin-top: 10px;">
                    <label for="other_gender">Please specify:</label>
                    <input type="text" id="other_gender" name="other_gender" placeholder="Enter your gender">
                </div>

                <div class="date_of_birth">
                    <label for="date_of_birth">Date of Birth:</label>
                    <input type="date" name="date_of_birth" id="date_of_birth" required>
                </div>

                <div class="country">
                    <label for="country">Country:</label>
                    <select name="country" id="country" required>
                        <option value=""disabled selected>Select a country</option>
                        <option value="Philippines">Philippines</option>
                        <option value="Indonesia">Indonesia</option>
                        <option value="United States">United States</option>
                        <option value="United Kingdom">United Kingdom</option>
                        <option value="Australia">Australia</option>
                    </select>
                </div>

                <div class="terms_and_conditions">
                    <input type="checkbox" name="terms_and_conditions" id="terms_and_conditions" required>
                    <label for="terms_and_conditions">I agree to the <a href="terms.html" target="_blank"> terms and conditions</a></label>
                </div>

                <div class="submit">
                    <input type="submit" value="Register" disabled>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Bring Back the Light</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
